name: dev

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  # a push that only touches .github is ignored above, so allow starting this by hand
  workflow_dispatch:

env: 
  JAVA_VERSION: '21'

jobs:
  dev:
    runs-on: ubuntu-latest
    concurrency: 
      group: release
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: gradle

    # Robolectric downloads the Android runtime it tests against on first use, so cache it between runs
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}

    # before building, so that a failing test does not produce an APK
    - run: ./gradlew testDebugUnitTest --stacktrace

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/testDebugUnitTest

    - run: ./gradlew assembleDebug --stacktrace

    - name: Read version from Gradle
      run: |
        VERSION_NAME=$(./gradlew -q printVersionName)
        VERSION_CODE=$(./gradlew -q printVersionCode)
        echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
        echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

    - name: Rename APK
      run: |
        APK_OUT=$(ls app/build/outputs/apk/debug/app-debug.apk)
        mv "$APK_OUT" "app/build/outputs/apk/debug/DroidPlane-${VERSION_NAME}-dev.apk"

    - uses: actions/upload-artifact@v4
      with:
        name: DroidPlane-${{ env.VERSION_NAME }}-dev
        path: app/build/outputs/apk/debug/DroidPlane-${{ env.VERSION_NAME }}-dev.apk

