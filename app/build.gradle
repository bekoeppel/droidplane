apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "ch.benediktkoeppel.code.droidplane"
        minSdkVersion 21
        targetSdk 36

        versionCode 21
        versionName "1.0.21"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    namespace 'ch.benediktkoeppel.code.droidplane'
    compileSdk 36

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-analytics:18.1.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Unit tests run on the JVM, where android.jar is only a stub. Robolectric gives us the real implementations of
    // the Android classes the mindmap loading depends on - Html.fromHtml, Uri and the XML pull parser.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.register("printVersionName") { doLast { println android.defaultConfig.versionName } }
tasks.register("printVersionCode") { doLast { println android.defaultConfig.versionCode } }

